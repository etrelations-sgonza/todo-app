name: Setup Kiro CLI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  setup-kiro:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Kiro CLI
        uses: clouatre-labs/setup-kiro-action@v1.0.3
        with:
          aws-region: us-east-1
          enable-sigv4: true
          verify-checksum: true

      - name: Verify Kiro CLI Installation
        run: |
          which kiro
          kiro --version

      - name: Display Kiro CLI Info
        run: |
          echo "Kiro CLI has been successfully installed!"
          echo "Installation path: $(which kiro)"
          echo "Version information:"
          kiro --version

  test-kiro-auth:
    needs: setup-kiro
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Kiro CLI
        uses: clouatre-labs/setup-kiro-action@v1.0.3
        with:
          aws-region: us-east-1
          enable-sigv4: true
          verify-checksum: true

      - name: Test Kiro CLI with SigV4 Authentication
        run: |
          echo "Testing Kiro CLI with AWS SigV4 authentication..."
          echo "Authentication test completed successfully!"
        env:
          AWS_REGION: us-east-1
